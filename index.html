<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuimiLab: El Enlace Maestro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1>🧪 Misión: Enlaces Químicos</h1>
            <div class="scoreboard" role="status" aria-live="polite">
                <span>Puntos: <strong id="score">0</strong></span>
                <span>Nivel: <strong id="rank">Novato</strong></span>
            </div>
        </div>
    </header>

    <main class="app-wrapper">
        <section class="lab-zone">
            <div class="instruction-box">
                <h2>Laboratorio de Estabilidad</h2>
                <p>Arrastra un **Metal** y un **No Metal** al reactor para crear un enlace iónico, o dos **No Metales** para uno covalente.</p>
            </div>

            <div class="workspace">
                <!-- Estante de Elementos -->
                <div class="element-shelf" id="shelf">
                    <div class="element metal" draggable="true" data-type="metal" data-name="Sodio" data-symbol="Na">Na</div>
                    <div class="element metal" draggable="true" data-type="metal" data-name="Magnesio" data-symbol="Mg">Mg</div>
                    <div class="element non-metal" draggable="true" data-type="non-metal" data-name="Cloro" data-symbol="Cl">Cl</div>
                    <div class="element non-metal" draggable="true" data-type="non-metal" data-name="Oxígeno" data-symbol="O">O</div>
                </div>

                <!-- Cámara de Reacción -->
                <div class="reactor-core" id="drop-zone">
                    <div class="core-placeholder">Zona de Reacción</div>
                    <div id="reaction-display" class="reaction-display"></div>
                </div>
            </div>
        </section>

        <aside class="log-panel">
            <h3>Bitácora de Investigación</h3>
            <div id="feedback-log" class="log-content">
                <p class="msg-info">Esperando reactivos...</p>
            </div>
            <button id="clear-btn" class="btn-reset">Limpiar Reactor</button>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
